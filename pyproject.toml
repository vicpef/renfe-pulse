[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "renfe-pulse"
version = "0.1.0"
description = "Sitio estático que resume los datos abiertos de Renfe (data.renfe.com)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
renfe-pulse = "renfe_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
renfe_pulse = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
