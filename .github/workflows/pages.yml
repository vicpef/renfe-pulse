name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    # Cada 30 min de 06:00 a 23:30, hora de Madrid. El cron de GitHub va en UTC y España cambia
    # de hora, así que cubrimos de 04:00 a 22:30 UTC y el job `horario` descarta lo que cae fuera
    # en hora local. GitHub puede retrasar unos minutos las ejecuciones programadas.
    - cron: "0,30 4-22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  horario:
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.check.outputs.publicar }}
    steps:
      - id: check
        run: |
          hora=$(TZ=Europe/Madrid date +%-H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$hora" -ge 6 ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "Son las $(TZ=Europe/Madrid date +%H:%M) en Madrid: no se publica hasta las 06:00."
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: horario
    if: needs.horario.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Lint y tests
        run: |
          ruff check .
          pytest -q

      - id: pages
        uses: actions/configure-pages@v6

      - name: Generar el sitio
        run: python -m renfe_pulse build --out _site
        env:
          # El histórico se reconstruye a partir del data/history.json ya publicado
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
