name: Publicar sitio

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # cada hora (UTC); GitHub puede retrasar unos minutos las ejecuciones
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Lint y tests
        run: |
          ruff check .
          pytest -q

      - id: pages
        uses: actions/configure-pages@v5

      - name: Generar el sitio
        run: python -m renfe_pulse build --out _site
        env:
          # El histórico se reconstruye a partir del data/history.json ya publicado
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
